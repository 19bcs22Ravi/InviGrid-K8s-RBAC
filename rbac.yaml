apiVersion: v1
kind: Namespace
metadata:
  name: invigrid-dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: invigrid-prod
---
# Read/Write in invigrid-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: invigrid-dev-edit
  namespace: invigrid-dev
subjects:
  - kind: Group
    name: invigrid-dev-group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# Read-Only in invigrid-prod (built-in 'view' role also blocks Secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: invigrid-prod-view
  namespace: invigrid-prod
subjects:
  - kind: Group
    name: invigrid-dev-group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io